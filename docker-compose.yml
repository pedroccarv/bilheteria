services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bilheteria
      POSTGRES_USER: bilheteria
      POSTGRES_PASSWORD: bilheteria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilheteria -d bilheteria"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/bilheteria
      DB_USER: bilheteria
      DB_PASSWORD: bilheteria
    ports:
      - "8080:8080"

volumes:
  pgdata:
